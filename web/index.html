<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wisp · Activity</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><h1>Wisp</h1><span id="connection" role="status">Connecting…</span></header>
  <main>
    <section aria-labelledby="agent-name"><h2 id="agent-name">Agent</h2><p id="model"></p><div id="capabilities"></div></section>
    <section aria-labelledby="runs-title"><h2 id="runs-title">Recent runs</h2><p id="error" role="alert"></p><div id="runs">No runs yet.</div></section>
    <section aria-labelledby="detail-title"><h2 id="detail-title">Run activity</h2><div id="detail">Select a run to inspect its history.</div></section>
  </main>
  <footer>Execution history is a record. Each run starts with fresh context.</footer>
</body>
</html>
