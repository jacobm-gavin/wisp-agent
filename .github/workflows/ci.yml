name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./...
      - name: Build application
        run: CGO_ENABLED=0 go build -o /tmp/wisp-minimal ./examples/minimal
      - name: Fuzz provider response decoding
        if: runner.os == 'Linux'
        run: go test -run '^$' -fuzz FuzzResponseProtocol -fuzztime=10s ./model/openrouter
